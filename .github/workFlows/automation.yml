name: Financial News Auto-Refresh

on:
  schedule:
    # This runs your code automatically every 4 hours, 365 days a year
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows you to run it manually anytime you want

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repo code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fetch feeds and build site
      run: python data_collector.py

    - name: Commit and update website files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git commit -m "Automated update: Fresh news headlines compiled" || echo "No changes found to commit"
        git push
